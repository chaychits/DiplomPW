name: pw7 ╨░╨▓╤В╨╛╤В╨╡╤Б╤В╤Л UI/API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  pw7:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    
    env:
      UI_URL: ${{ vars.UI_URL }}
      API_URL: ${{ vars.API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: ╨г╤Б╤В╨░╨╜╨╛╨▓╨╕╤В╤М ╨╖╨░╨▓╨╕╤Б╨╕╨╝╨╛╤Б╤В╨╕
        run: npm ci

      - name: ╨г╤Б╤В╨░╨╜╨╛╨▓╨╕╤В╤М ╨▒╤А╨░╤Г╨╖╨╡╤А╤Л Playwright
        run: npx playwright install --with-deps chromium

      - name: Setup AllureCTL
        uses: allure-framework/setup-allurectl@v1
        with:
          allure-endpoint: https://allure.autotests.cloud
          allure-token: ${{ secrets.ALLURE_TOKEN }}
          allure-project-id: 5305

      - name: ╨Ч╨░╨┐╤Г╤Б╤В╨╕╤В╤М ╤В╨╡╤Б╤В╤Л
        run: npx playwright test

      - name: ╨Ч╨░╨│╤А╤Г╨╖╨╕╤В╤М ╤А╨╡╨╖╤Г╨╗╤М╤В╨░╤В╤Л ╨▓ Allure TestOps
        if: always()
        env:
          ALLURE_ENDPOINT: https://allure.autotests.cloud
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
        run: |
          allurectl upload allure-results \
            --endpoint "$ALLURE_ENDPOINT" \
            --project-id 5305 \
            --token "$ALLURE_TOKEN"

      - name: ╨Я╨╛╨╗╤Г╤З╨╕╤В╤М ╤Б╤Б╤Л╨╗╨║╤Г Allure TestOps
        if: always()
        continue-on-error: true
        run: |
          allurectl job-run env | grep '^ALLURE_LAUNCH_URL=' >> "$GITHUB_ENV"
        env:
          ALLURE_ENDPOINT: https://allure.autotests.cloud
          ALLURE_PROJECT_ID: 5305
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}

      - name: ╨б╨│╨╡╨╜╨╡╤А╨╕╤А╨╛╨▓╨░╤В╤М Allure Report
        if: always()
        run: |
          npx allure-commandline generate allure-results \
            -o allure-report \
            --clean
        continue-on-error: true

      - name: ╨Ч╨░╨│╤А╤Г╨╖╨╕╤В╤М ╨╛╤В╤З╨╡╤В╤Л ╨║╨░╨║ Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            allure-report
            allure-results
            playwright-report
          retention-days: 30

      - name: Setup Java
        if: always()
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: ╨б╨║╨░╤З╨░╤В╤М Allure Notifications
        if: always()
        run: |
          mkdir -p notifications
          curl -L \
            https://github.com/qa-guru/allure-notifications/releases/download/v5.0.2/allure-notifications-5.0.2.jar \
            -o notifications/allure-notifications.jar

      - name: ╨б╨╛╨╖╨┤╨░╤В╤М config.json ╨┤╨╗╤П Telegram
        if: always()
        run: |
          cat > notifications/config.json <<EOF
          {
            "base": {
              "project": "dip",
              "environment": "GitHub Actions",
              "comment": "Automated test run",
              "language": "en",
              "allureFolder": "allure-report/",
              "allureResultsFolder": "allure-results/",
              "enableChart": true,
              "darkMode": true,
              "links": {
                "testops": "${ALLURE_LAUNCH_URL}",
                "report": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "build": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }
            },
            "telegram": {
              "token": "${{ secrets.TELEGRAM_BOT_TOKEN }}",
              "chat": "${{ secrets.TELEGRAM_CHAT_ID }}",
              "templatePath": "/templates/telegram.ftl"
            }
          }
          EOF

      - name: ╨Ю╤В╨┐╤А╨░╨▓╨╕╤В╤М ╤Г╨▓╨╡╨┤╨╛╨╝╨╗╨╡╨╜╨╕╨╡ ╨▓ Telegram
        if: always()
        run: |
          java \
            "-DconfigFile=notifications/config.json" \
            "-Dorg.apache.http.wire=OFF" \
            -jar notifications/allure-notifications.jar
