name: pw7 автотесты UI/API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  pw7:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    
    env:
      UI_URL: ${{ vars.UI_URL }}
      API_URL: ${{ vars.API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Установить браузеры Playwright
        run: npx playwright install --with-deps chromium

      - name: Setup AllureCTL
        uses: allure-framework/setup-allurectl@v1
        with:
          allure-endpoint: https://allure.qa.guru
          allure-token: ${{ secrets.ALLURE_TOKEN }}
          allure-project-id: 5305

      - name: Проверить ALLURE_TOKEN
        if: always()
        env:
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
        run: |
          if [ -z "$ALLURE_TOKEN" ]; then
            echo "ERROR: ALLURE_TOKEN EMPTY"
            exit 1
          fi
          echo "ALLURE_TOKEN exists"
          echo "Token length: ${#ALLURE_TOKEN}"   

      - name: Запустить тесты
        run: npx playwright test

      - name: Загрузить результаты в Allure TestOps
        if: always()
        run: allurectl upload allure-results


      - name: Сгенерировать Allure Report
        if: always()
        run: |
          npx allure-commandline generate allure-results \
            -o allure-report \
            --clean
        continue-on-error: true

      - name: Загрузить отчеты как Artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-report
          path: |
            allure-report
            allure-results
            playwright-report
          retention-days: 30

      - name: Setup Java
        if: always()
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Скачать Allure Notifications
        if: always()
        run: |
          mkdir -p notifications
          curl -L \
            https://github.com/qa-guru/allure-notifications/releases/download/v5.0.2/allure-notifications-5.0.2.jar \
            -o notifications/allure-notifications.jar

      - name: Создать config.json для Telegram
        if: always()
        run: |
          cat > notifications/config.json <<EOF
          {
            "base": {
              "project": "diplom",
              "environment": "GitHub Actions",
              "comment": "Automated test run",
              "language": "en",
              "allureFolder": "allure-report/",
              "allureResultsFolder": "allure-results/",
              "enableChart": false,
              "darkMode": true,
              "links": {
                "testops": "https://allure.qa.guru/project/5305",
                "report": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "build": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }
            },
            "telegram": {
              "token": "${{ secrets.TELEGRAM_BOT_TOKEN }}",
              "chat": "${{ secrets.TELEGRAM_CHAT_ID }}",
              "templatePath": "/templates/telegram.ftl"
            }
          }
          EOF

      - name: Отправить уведомление в Telegram
        if: always()
        run: |
          java \
            "-DconfigFile=notifications/config.json" \
            "-Dorg.apache.http.wire=OFF" \
            -jar notifications/allure-notifications.jar
